<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="kui-viewport" content="mode=browser">
    <meta name="kui-mouse-events" content="intercept">
    <link rel="icon" href="data:,">
    <title>McUI 2.0 组件总览</title>
    <link rel="stylesheet" href="../../runtime/mcui/components.css">
    <link rel="stylesheet" href="../../runtime/mcui/kui-defaults.css">
    <link rel="stylesheet" href="../../runtime/mcui/fonts.css">
    <link rel="stylesheet" href="../../runtime/mcui/gallery.css">
</head>
<body>
<div id="app">McUI 2.0 is loading...</div>
<script src="../../runtime/vue.kui.js"></script>
<script src="../../runtime/mcui/mcui-oreui.kui.js"></script>
<script src="../../runtime/mcui/mcui-icons-normal.kui.js"></script>
<script src="../../runtime/mcui/mcui-sounds-default.kui.js"></script>
<script src="../../runtime/mcui/gallery.kui.js"></script>
<script>
    var app = Vue.createApp(McUIVisualGallery.default);
    app.use(McUIVue.createMcUI({
        locale: { locale: 'en' },
        display: { ssrWidth: 1280 },
        icons: { sets: { mc: McUINormalIcons.mcNormalIconSet } },
        sounds: { enabled: true, sounds: McUIDefaultSounds.mcDefaultSounds }
    }));
    app.mount('#app');
</script>
</body>
</html>
