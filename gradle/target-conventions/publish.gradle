// Applied from an individual target project, not from the aggregate root project.
apply plugin: 'maven-publish'

tasks.named('javadoc', Javadoc).configure {
    options.encoding = 'UTF-8'
    options.docEncoding = 'UTF-8'
    options.charSet = 'UTF-8'
}

def mavenJavadocJar = tasks.register('mavenJavadocJar', Jar) {
    group = 'publishing'
    description = 'Packages API documentation for Maven publishing.'
    archiveClassifier = 'javadoc'
    from tasks.named('javadoc')
}

repositories {
    flatDir {
        dirs layout.projectDirectory.dir('libs')
    }
}

dependencies {
    implementation fileTree(dir: file('libs'), include: ['*.jar'], exclude: ['*-sources.jar', '*-javadoc.jar'])
}

// KUI: common/ is a shared source tree compiled into this target via source-set
// sharing (not an included Gradle project), so the shared resources directory is
// referenced by relative path instead of project(':common').
sourceSets.main.resources.srcDir file('../../common/src/main/resources')

// Ship the English documentation inside the mod jar at the jar root, next to
// assets/ (e.g. docs/en/getting-started.md).
tasks.named('processResources', ProcessResources).configure {
    from('../../docs/en') {
        into 'docs/en'
    }
}

def publishLoader = project.projectDir.name.tokenize('-').first()
def publishMinecraftVersion = [
        forge    : providers.gradleProperty('forge_minecraft_version'),
        fabric   : providers.gradleProperty('fabric_minecraft_version'),
        neoforge : providers.gradleProperty('neoforge_121_minecraft_version')
                .orElse(providers.gradleProperty('neoforge_261_minecraft_version'))
                .orElse(providers.gradleProperty('neoforge_262_minecraft_version'))
][publishLoader]

def publishArtifactTask = tasks.findByName('remapJar') != null ?
        tasks.named('remapJar') :
        (tasks.findByName('reobfJar') != null ? tasks.named('reobfJar') : tasks.named('jar', Jar))
def publishFile = publishArtifactTask.flatMap { it.archiveFile }
def curseforgeProjectId = providers.provider { findProperty('publish_curseforge_project_id')?.toString() }
        .orElse(providers.environmentVariable('CURSEFORGE_PROJECT_ID'))
def modrinthProjectId = providers.provider { findProperty('publish_modrinth_project_id')?.toString() }
        .orElse(providers.environmentVariable('MODRINTH_PROJECT_ID'))

publishMods {
    file = publishFile
    changelog = providers.environmentVariable('PUBLISH_CHANGELOG').getOrElse('See the project changelog for details.')
    type = STABLE
    modLoaders.add(publishLoader)

    curseforge {
        projectId = curseforgeProjectId
        accessToken = providers.environmentVariable('CURSEFORGE_TOKEN')
        minecraftVersions.add(publishMinecraftVersion)
        client = true
        server = true
    }

    modrinth {
        projectId = modrinthProjectId
        accessToken = providers.environmentVariable('MODRINTH_TOKEN')
        minecraftVersions.add(publishMinecraftVersion)
    }
}

tasks.named('publishMods').configure {
    doFirst {
        def missing = [
                'publish_curseforge_project_id (or CURSEFORGE_PROJECT_ID)': curseforgeProjectId,
                'publish_modrinth_project_id (or MODRINTH_PROJECT_ID)'    : modrinthProjectId,
                'CURSEFORGE_TOKEN'                                        : providers.environmentVariable('CURSEFORGE_TOKEN'),
                'MODRINTH_TOKEN'                                          : providers.environmentVariable('MODRINTH_TOKEN')
        ].findAll { _, value -> !value.present || value.get().trim().isEmpty() }.keySet()

        if (!missing.isEmpty()) {
            throw new GradleException("Cannot publish mods; missing: ${missing.join(', ')}")
        }
    }
}

// Legacy Forge's jar task produces the development-mapped jar first and
// reobfJar rewrites it for production. Make every publishing task wait for the
// target-specific production artifact verification instead of relying on a
// jar finalizer's execution order.
if (tasks.findByName('verifyReobfuscatedJar') != null) {
    def productionJarVerification = tasks.named('verifyReobfuscatedJar')
    tasks.configureEach { task ->
        if (task.name.startsWith('publish')) {
            task.dependsOn productionJarVerification
        }
    }
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java

            groupId = project.group.toString()
            artifactId = base.archivesName.get()
            version = project.version.toString()

            artifact mavenJavadocJar

            pom {
                name = base.archivesName.get()
                description = "${mod_name} Web UI for Minecraft ${publishMinecraftVersion.get()} (${publishLoader})"
                url = 'https://github.com/kltyton/KltytonUI'
                licenses {
                    license {
                        name = 'GNU Lesser General Public License, version 2.1'
                        url = 'https://www.gnu.org/licenses/old-licenses/lgpl-2.1.html'
                        distribution = 'repo'
                    }
                }
                developers {
                    developer {
                        id = 'kltyton'
                        name = mod_authors
                        url = 'https://github.com/kltyton'
                    }
                }
                scm {
                    connection = 'scm:git:https://github.com/kltyton/KltytonUI.git'
                    developerConnection = 'scm:git:ssh://git@github.com/kltyton/KltytonUI.git'
                    url = 'https://github.com/kltyton/KltytonUI'
                }
            }

            // Loader and Minecraft dependencies are supplied by the game runtime,
            // so the published mod POM must not expose the target build classpath.
            pom.withXml {
                def dependenciesNode = asNode().getAt('dependencies')[0]
                if (dependenciesNode != null) {
                    dependenciesNode.children().toList().each { dependency ->
                        dependenciesNode.remove(dependency)
                    }
                }
            }
        }
    }

    repositories {
        def publishUrl = providers.gradleProperty('publish_maven_url')
                .orElse(providers.environmentVariable('KLTYTONUI_MAVEN_URL'))
        if (publishUrl.isPresent()) {
            maven {
                name = 'remoteRepo'
                url = uri(publishUrl.get())
                credentials {
                    username = System.getenv('KLTYTONUI_MAVEN_USER')
                    password = System.getenv('KLTYTONUI_MAVEN_PASSWORD')
                }
            }
        }
    }
}

tasks.named('publish') {
    doFirst {
        if (!providers.gradleProperty('publish_maven_url')
                .orElse(providers.environmentVariable('KLTYTONUI_MAVEN_URL')).isPresent()) {
            throw new GradleException('Set publish_maven_url or KLTYTONUI_MAVEN_URL before publishing.')
        }
    }
}

tasks.withType(GenerateModuleMetadata).configureEach {
    enabled = false
}

apply from: file('../../gradle/target-conventions/central.gradle')
